name: CI and SonarCloud

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: medichain
          POSTGRES_PASSWORD: medichain
          POSTGRES_DB: medichain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medichain -d medichain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://medichain:medichain@localhost:5432/medichain?schema=public
      JWT_SECRET: ci-only-secret-with-at-least-32-bytes
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Apply database migrations
        run: npx prisma migrate deploy
      - name: Run tests with coverage
        run: npm run test:coverage
      - name: SonarCloud Scan
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
        env:
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_TOKEN: ${{ secrets.TOKEN_SONAR }}
